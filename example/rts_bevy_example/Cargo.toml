[package]
name = "rts_test"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"

[dependencies]
base64 = "0.22"
bevy = "0.18"
bytes = "1.11"
flate2 = "1.1"
rtc = "0.8.5"
rtc-ice = "0.8.5"
stun = { version = "0.8.5", package = "rtc-stun" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4"] }
