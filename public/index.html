<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17191c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
    <title>Open Dwarf</title>
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <main id="game" aria-label="Open Dwarf world">
      <canvas id="world" aria-label="Open Dwarf game world"></canvas>
      <div id="loading" role="status">Connecting to world…</div>
      <button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen"
        title="Enter fullscreen">⛶</button>
      <output id="display-status" role="status" aria-live="polite"></output>
      <aside id="diagnostics" hidden aria-label="Host diagnostics"></aside>
      <div id="host-tools" hidden>
        <button id="join-toggle" type="button"
          aria-label="Show join code">QR</button>
        <span id="player-count">1 player</span>
      </div>
      <aside id="join-panel" hidden aria-label="Join this world">
        <h1>JOIN THIS WORLD</h1>
        <img id="join-code" alt="Scan to join this world" width="384"
          height="384">
        <a id="join-link" href="#"></a>
        <button id="join-close" type="button">Play</button>
      </aside>
      <div id="controls" aria-label="Touch controls">
        <section class="stick move" aria-label="Move controller">
          <span class="control-name">MOVE <b>ESDF</b> · SPEED <b>G</b> · SPRINT <b>H</b></span>
          <button class="stick-hit" data-stick="move" type="button"
            aria-label="Move controller"><span class="octant-guides" aria-hidden="true"></span><span class="stick-deadzone" aria-hidden="true"></span><span class="stick-knob" aria-hidden="true"></span></button>
          <span class="actions">
            <button class="action" id="speed-button" type="button"
              aria-label="Speed 30 feet per round">30</button>
            <button class="action" id="sprint-button" type="button"
              aria-label="Sprint" aria-pressed="false">»</button>
          </span>
        </section>
        <section class="stick camera" aria-label="Look or pan controller">
          <span class="control-name">LOOK <b>IJKL</b></span>
          <button class="stick-hit" data-stick="camera" type="button"
            aria-label="Look or pan controller"><span class="octant-guides" aria-hidden="true"></span><span class="stick-deadzone" aria-hidden="true"></span><span class="stick-knob" aria-hidden="true"></span></button>
          <span class="actions">
            <button class="action" id="chat-button" type="button"
              aria-label="Open chat">A</button>
            <button class="action" id="menu-button" type="button"
              aria-label="Open menu">B</button>
          </span>
        </section>
      </div>
      <input id="chat-input" maxlength="120" autocomplete="off"
        autocapitalize="sentences" aria-label="Chat message or slash command">
      <aside id="admin" hidden>
        <h1>Active worlds</h1>
        <p id="admin-status">Looking for visitors…</p>
        <p id="net-stats"></p>
        <ul id="sessions"></ul>
      </aside>
    </main>
  </body>
</html>
