<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- The shell sets href to where this build's files live, fills
      <script id="od-build" type="application/json"> with the build's base, API
      origin, label, and commit, and serves the page at any depth. -->
    <base href="/">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17191c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Not black-translucent: in an iOS 26 Home Screen app the translucent bar
      makes the viewport short by the status bar's height, and iOS leaves the
      strip at the bottom unpainted. No CSS or script recovers it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Open Dwarf</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Open Dwarf">
    <!-- Startup is independent of the CDN, stylesheets, and WebGL. The atlas
      below is public/assets/font.png, embedded so the first message can use it. -->
    <style>
    html, body { margin: 0; background: #17191c; color: #f0e6d2; }
    #boot-loading { position: fixed; inset: 0; z-index: 10; overflow: auto;
      padding: max(40px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: #17191c; font: 16px/1.6 ui-monospace, monospace; }
    #boot-loading[hidden], #boot-loading [hidden] { display: none; }
    .boot-terminal { max-width: 640px; margin: 8vh auto 0; }
    #boot-loading h1 { font: inherit; margin: 0 0 32px; color: #e0b45a; }
    #boot-log { list-style: none; padding: 0; margin: 0; color: #9d9a90; }
    #boot-log li, #boot-current { margin: 0 0 8px; }
    #boot-current { color: #f0e6d2; }
    #boot-detail { color: #b5ad99; min-height: 32px; margin: 16px 0 0; }
    #boot-retry { color: #e0b45a; background: transparent; border: 1px solid #726341;
      padding: 10px 14px; font: inherit; cursor: pointer; margin-top: 16px; }
    #boot-retry:focus-visible { outline: 2px solid #e0b45a; outline-offset: 4px; }
    #boot-error { white-space: pre-wrap; overflow-wrap: anywhere; color: #e6b6a5;
      font: 13px/1.5 ui-monospace, monospace; margin: 24px 0 0; }
    .boot-label { position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
    .boot-pixels { display: inline; }
    .boot-pixels i { display: inline-block; width: 8px; height: 16px;
      vertical-align: middle; background: currentColor;

      mask-position: calc(var(--x) * -8px) calc(var(--y) * -16px);
      mask-repeat: no-repeat; image-rendering: pixelated; }
    .boot-pixels i.boot-space { background: transparent; }
    @media (min-width: 700px) {
      #boot-loading { font-size: 24px; }
      .boot-pixels i { width: 12px; height: 24px; mask-size: 384px 72px;
        mask-position: calc(var(--x) * -12px) calc(var(--y) * -24px); }
    }
    </style>
    <script>
    (() => {
      const root = document.documentElement;
      const started = Date.now();
      const lines = [];
      let failed = false;
      let stage = "code";
      const labels = {
        build: "Finding the game build...",
        code: "Loading game code...",
        world: "Preparing the world...",
        graphics: "Preparing graphics...",
        frame: "Drawing the first view...",
      };
      // Reuse the game's 8x16 atlas in HTML. It is embedded in the style above,
      // so even a blocked CDN cannot withhold the terminal's font.
      const text = (element, value) => {
        if (!element) return;
        const pixels = document.createElement("span");
        pixels.className = "boot-pixels";
        pixels.setAttribute("aria-hidden", "true");
        for (const char of value) {
          const glyph = document.createElement("i");
          const code = char.charCodeAt(0) - 33;
          if (code >= 0 && code < 94) {
            glyph.style.setProperty("--x", String(code % 32));
            glyph.style.setProperty("--y", String(Math.floor(code / 32)));
          } else glyph.className = "boot-space";
          pixels.append(glyph);
        }
        const label = document.createElement("span");
        label.className = "boot-label";
        label.textContent = value;
        element.replaceChildren(label, pixels);
      };
      const report = (next, detail = "") => {
        if (failed || root.dataset.booted === "true") return;
        const current = document.getElementById("boot-current");
        if (next !== stage && current) {
          const done = document.createElement("li");
          text(done, `[ok] ${labels[stage].replace(/\.\.\.$/, "")}`);
          document.getElementById("boot-log").append(done);
        }
        stage = next;
        root.dataset.bootStage = next;
        text(current, `> ${labels[next]}`);
        text(document.getElementById("boot-detail"), detail);
      };
      const complete = () => {
        if (failed) return;
        root.dataset.booted = "true";
        root.dataset.bootStage = "ready";
        performance.mark("od-first-world-frame");
        document.getElementById("boot-loading").hidden = true;
      };
      globalThis.__odLoading = { report, complete };
      const show = (line) => {
        if (root.dataset.booted === "true") return;
        failed = true;
        root.dataset.bootStage = "failed";
        if (line) lines.push(line);
        text(document.getElementById("boot-current"), "[fail] The game could not start.");
        text(document.getElementById("boot-detail"), "Check your connection, then try again.");
        document.getElementById("boot-retry")?.removeAttribute("hidden");
        const panel = document.getElementById("boot-error");
        if (!panel) return;
        let build = "";
        try {
          build = JSON.parse(
            document.getElementById("od-build")?.textContent || "{}",
          ).commit || "local";
        } catch {
          build = "unknown";
        }
        panel.textContent = [
          "Open Dwarf could not start.",
          "",
          ...lines,
          "",
          `Build: ${String(build).slice(0, 7)}`,
          `After: ${((Date.now() - started) / 1000).toFixed(1)} s`,
          `Browser: ${navigator.userAgent}`,
        ].join("\n");
        panel.hidden = false;
      };
      const describe = (error) =>
        error && typeof error === "object"
          ? `${error.name || "Error"}: ${error.message || error}${
            error.stack ? `\n${String(error.stack).slice(0, 600)}` : ""
          }`
          : String(error);
      addEventListener("error", (event) => {
        const target = event.target;
        if (target && target !== window && target.tagName) {
          show(`Could not load ${target.src || target.href || target.tagName}`);
        } else {
          show(
            `${event.message || "Error"}${
              event.filename
                ? `\n  at ${event.filename}:${event.lineno}:${event.colno}`
                : ""
            }${
              event.error?.stack
                ? `\n${String(event.error.stack).slice(0, 600)}`
                : ""
            }`,
          );
        }
      }, true);
      addEventListener("unhandledrejection", (event) => {
        show(`Unhandled: ${describe(event.reason)}`);
      });
      globalThis.__odBootError = (error) => show(describe(error));
      document.addEventListener("od-loading-mount", () => {
        stage = root.dataset.shell === "true" ? "build" : "code";
        for (const element of document.querySelectorAll("[data-boot-text]")) {
          text(element, element.textContent);
        }
        if (stage === "code" && document.getElementById("od-build")) {
          const done = document.createElement("li");
          text(done, "[ok] Game build ready");
          document.getElementById("boot-log").append(done);
        }
        report(stage);
        document.getElementById("boot-retry").addEventListener("click", () => location.reload());
        if (root.dataset.shell === "true") {
          const page = new URL(location.href);
          page.searchParams.set("__od_page", "1");
          fetch(page).then(async (response) => {
            if (!response.ok) throw new Error(`Build request answered ${response.status}`);
            const html = await response.text();
            // Replace the early shell with the selected commit's own page. Its
            // base, scripts, and older entrypoints keep their original behavior.
            clearTimeout(slowTimer);
            document.open();
            document.write(html);
            document.close();
          }).catch(show);
        }
      });
      const slowTimer = setTimeout(() => {
        if (root.dataset.booted === "true" || failed) return;
        text(document.getElementById("boot-detail"), "Taking longer than usual. Still working...");
        document.getElementById("boot-retry")?.removeAttribute("hidden");
      }, 15000);
    })();
    </script>
    <!-- game-assets:start -->
    <!-- Loaded as print first so a slow stylesheet does not hold back painting;
      the boot-error screen above has its own style. -->
    <link rel="stylesheet" href="css/app.css" media="print"
      onload="this.media = 'all'">
    <script type="module" src="js/app.js"></script>
    <!-- game-assets:end -->
  </head>
  <body>
    <main id="game">
      <canvas id="world" aria-label="Open Dwarf game world"></canvas>
      <!-- The game draws all its UI in the canvas. This region repeats the
        status text for screen readers. -->
      <output id="live-status" class="visually-hidden" role="status"
        aria-live="polite"></output>
    </main>
    <section id="boot-loading" aria-label="Game startup">
      <div class="boot-terminal">
        <h1 data-boot-text>OPEN DWARF</h1>
        <ol id="boot-log" aria-label="Completed startup steps">
          <li data-boot-text>[ok] Loading screen ready</li>
        </ol>
        <div role="status" aria-live="polite" aria-atomic="true">
          <p id="boot-current" data-boot-text>&gt; Starting Open Dwarf...</p>
          <p id="boot-detail"></p>
        </div>
        <button id="boot-retry" data-boot-text hidden>Try again</button>
        <pre id="boot-error" role="alert" hidden></pre>
        <noscript>JavaScript is required to play Open Dwarf.</noscript>
      </div>
    </section>
    <script>document.dispatchEvent(new Event("od-loading-mount"));</script>
  </body>
</html>
