<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- The shell sets href to where this build's files live, fills
      <script id="od-build" type="application/json"> with the build's base, API
      origin, label, and commit, and serves the page at any depth. -->
    <base href="/">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17191c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Not black-translucent: in an iOS 26 Home Screen app the translucent bar
      makes the viewport short by the status bar's height, and iOS leaves the
      strip at the bottom unpainted. No CSS or script recovers it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Open Dwarf</title>
    <link rel="stylesheet" href="css/app.css">
    <!-- The boot-error screen. A classic script, so it runs even when a module
      cannot load or parse. Until js/app.js marks the page booted, it writes a
      failed script, an uncaught error, or a slow start onto the page, so a
      phone shows the cause instead of a blank screen. -->
    <script>
      (() => {
        const root = document.documentElement;
        const started = Date.now();
        const lines = [];
        const show = (line) => {
          if (root.dataset.booted === "true") return;
          lines.push(line);
          const panel = document.getElementById("boot-error");
          if (!panel) return;
          let build = "";
          try {
            build = JSON.parse(
              document.getElementById("od-build")?.textContent || "{}",
            ).commit || "local";
          } catch {
            build = "unknown";
          }
          panel.textContent = [
            "Open Dwarf could not start.",
            "",
            ...lines,
            "",
            `Build: ${String(build).slice(0, 7)}`,
            `After: ${((Date.now() - started) / 1000).toFixed(1)} s`,
            `Browser: ${navigator.userAgent}`,
          ].join("\n");
          panel.hidden = false;
        };
        const describe = (error) =>
          error && typeof error === "object"
            ? `${error.name || "Error"}: ${error.message || error}${
              error.stack ? `\n${String(error.stack).slice(0, 600)}` : ""
            }`
            : String(error);
        addEventListener("error", (event) => {
          const target = event.target;
          if (target && target !== window && target.tagName) {
            show(`Could not load ${target.src || target.href || target.tagName}`);
          } else {
            show(
              `${event.message || "Error"}${
                event.filename ? `\n  at ${event.filename}:${event.lineno}:${event.colno}` : ""
              }${event.error?.stack ? `\n${String(event.error.stack).slice(0, 600)}` : ""}`,
            );
          }
        }, true);
        addEventListener("unhandledrejection", (event) => {
          show(`Unhandled: ${describe(event.reason)}`);
        });
        globalThis.__odBootError = (error) => show(describe(error));
        setTimeout(() => {
          if (root.dataset.booted !== "true" && !lines.length) {
            show("The game did not start within 15 seconds.");
          }
        }, 15000);
      })();
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="game">
      <canvas id="world" aria-label="Open Dwarf game world"></canvas>
      <!-- The game draws all its UI in the canvas. This region repeats the
        status text for screen readers. -->
      <output id="live-status" class="visually-hidden" role="status"
        aria-live="polite"></output>
    </main>
    <pre id="boot-error" role="alert" hidden></pre>
  </body>
</html>
