[package]
name = "world_runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
js-sys = "0.3.76"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
wasm-bindgen = "0.2.106"
bevy_math = "0.18"
web-sys = { version = "0.3.76", features = [
  "DedicatedWorkerGlobalScope",
  "MessageEvent",
  "Worker",
  "WorkerOptions",
  "WorkerType",
] }
world_sim = { path = "../world_sim" }
world_tiles = { path = "../world_tiles" }

[features]
default = []
