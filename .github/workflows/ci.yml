name: CI
# The merge gate: format, lint, types and unit tests, about a minute. Browser
# specs run in e2e.yml. Ticket pushes are checked by their PR, and the
# `evidence` branch holds only screenshots and videos.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # The od-test database: the Turso store tests run against it, and skip
      # without it (forks get no secrets).
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task verify
