name: E2E
# Nothing here blocks a merge. It runs every night on main, by hand, and on a
# pull request that carries the `e2e` label. A failed nightly run opens or
# updates an issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Four runners split the specs. Each keeps one worker, since the specs that
  # count frames or time a walk fail under load.
  browser-shard:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # With these set, the e2e config starts a second shell for the real
      # Xirsys spec.
      XIRSYS_IDENT: ${{ secrets.XIRSYS_IDENT }}
      XIRSYS_SECRET: ${{ secrets.XIRSYS_SECRET }}
      XIRSYS_CHANNEL: ${{ secrets.XIRSYS_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run -A npm:playwright@1.63.0 install --with-deps chromium
      - run: deno task e2e --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: exports/playwright-results
          retention-days: 7
  report:
    needs: browser-shard
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly e2e failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The nightly browser run failed: $RUN"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
